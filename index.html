<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24130c">
<meta name="description" content="チャーシューを積んで何倍盛りにできる？スマホで遊べるラーメン積みゲーム。">
<title>チャーシューメン、チャーシュー12倍</title>
<style>
:root{font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#fff0d7;background:#24130c;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;touch-action:pan-y}
body{background:radial-gradient(ellipse at 50% 5%,#76462d,#29160f 65%,#140c09);display:flex;justify-content:center}
#app{width:min(100%,620px);padding:14px 12px 12px;display:flex;flex-direction:column;min-height:100dvh;gap:10px}
.header{text-align:center;line-height:1.1;padding:5px 0 2px}
h1{margin:0;color:#fff1d3;font-weight:1000;font-size:clamp(23px,6.4vw,34px);letter-spacing:.04em;text-shadow:0 3px 1px #742e1d}
h1 span{display:block;font-size:.87em;color:#ffc86d;margin-top:4px}
.stage{position:relative;width:100%;aspect-ratio:4 / 5.55;max-height:min(78dvh,735px);border-radius:19px;overflow:hidden;box-shadow:0 14px 35px #100704a8;border:3px solid #a16e44;background:#74503a;isolation:isolate}
.stage:after{content:"";position:absolute;inset:4px;border:1px solid #e6b97669;border-radius:13px;pointer-events:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hud{position:absolute;top:11px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px;pointer-events:none;z-index:2}
.stat{background:#23140ebf;border:1px solid #e7b98683;border-radius:10px;padding:7px 9px;min-width:0;flex:1;box-shadow:0 3px 9px #17090863;backdrop-filter:blur(5px)}
.stat:nth-child(2){text-align:center}.stat:nth-child(3){text-align:right}
.stat small{font-size:10px;color:#ffdda8;display:block;font-weight:700;white-space:nowrap}
.stat strong{font-variant-numeric:tabular-nums;font-size:clamp(19px,5.2vw,28px);line-height:1.15;display:block;white-space:nowrap}
.stat strong.money{font-size:clamp(15px,4.2vw,23px);color:#ffe3ac}
.unit{font-size:12px;color:#fbd2a2}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:linear-gradient(180deg,#21100a74,#1d0e0bd9);backdrop-filter:blur(2px);z-index:5}
.overlay.hidden{display:none}
.panel{width:min(100%,385px);padding:24px 18px 21px;text-align:center;border-radius:19px;border:2px solid #edb678;background:linear-gradient(150deg,#734024,#381b13 70%);box-shadow:0 16px 30px #140703ad,inset 0 0 0 3px #ffffff0a}
.panel-label{color:#ffc67f;font-size:12px;font-weight:900;letter-spacing:.12em}
.panel h2{font-size:clamp(23px,6.6vw,31px);line-height:1.33;margin:12px 0;color:#fff7e5;overflow-wrap:anywhere}
.panel p{font-size:13px;line-height:1.85;color:#f7dcc0;margin:12px 0 19px}
.panel h2.result-title{font-size:clamp(20px,5.6vw,27px);letter-spacing:-.02em}
.result-detail{margin:13px auto 17px;max-width:300px;font-variant-numeric:tabular-nums;border-top:1px solid #e6ae7959;padding-top:10px}
.result-detail div{display:flex;justify-content:space-between;gap:9px;text-align:left;margin-top:6px;font-size:13px;color:#ffe6bf}
.result-detail b{white-space:nowrap}
.result-detail .change b{color:#a3e8ac}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.primary{background:linear-gradient(#ffe6ac,#ffb354);width:100%;min-height:54px;border:0;border-radius:99px;color:#582b14;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #a35028,0 8px 16px #12070352}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #a35028}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 2px 0}
.controls{font-size:12px;color:#e8c9a3}
.reset{background:#3d2519;border:1px solid #9f754f;color:#ffdfb1;padding:9px 14px;border-radius:99px;font-size:12px;font-weight:800}
@media(max-width:380px){#app{padding:10px 8px}.stage{max-height:none}.stat{padding:6px 6px}.stat small{font-size:9px}.controls{font-size:11px}.panel{padding:19px 12px}}
@media(max-height:700px){#app{gap:6px}.stage{max-height:74dvh}.header{padding:0}.bottom{padding-top:0}}
</style>
</head>
<body>
<main id="app">
<header class="header"><h1>チャーシューメン<span>チャーシュー12倍</span></h1></header>
<section class="stage" aria-label="チャーシューを積むゲーム">
<canvas id="game" aria-label="タップで1枚、長押しで連続投下"></canvas>
<div class="hud" aria-live="polite">
<div class="stat"><small>チャーシュー</small><strong id="score">6<span class="unit">枚</span></strong></div>
<div class="stat"><small>最高記録</small><strong id="best">6<span class="unit">枚</span></strong></div>
<div class="stat"><small>お会計</small><strong class="money" id="total">1,370円</strong></div>
</div>
<div class="overlay" id="overlay"><div class="panel">
<div class="panel-label" id="panel-label">特製チャーシューメン</div>
<h2 id="panel-title">何枚のせられる？</h2>
<p id="panel-info">タップで1枚、長押しで連続投下。<br>器から落ちたら終了！</p>
<div id="result-detail" class="result-detail" hidden></div>
<button id="start" class="primary" type="button">ゲームスタート</button>
</div></div>
</section>
<div class="bottom"><span class="controls">タップ：1枚 ／ 長押し：連続投下</span><button class="reset" id="restart" type="button">やり直す</button></div>
</main>
<script>
(()=>{'use strict';
const BASE=6, RAMEN=950, SLICE=70, GRAMS=12, MM=7;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const el={score:$('score'),best:$('best'),total:$('total'),overlay:$('overlay'),label:$('panel-label'),title:$('panel-title'),info:$('panel-info'),details:$('result-detail'),start:$('start'),restart:$('restart')};
let W=360,H=510,dpr=1,stage='menu',bodies=[],score=BASE,best=BASE;
let now=0,prev=0,aim=0,dir=1,holding=false,holdStart=0,lastFire=-Infinity,heldPointer=null,ended=false,shots=0;
let lastFrameError=false;
try{best=Math.max(BASE,Number(localStorage.getItem('chashu-best-v3'))||BASE)}catch{}
const min=(a,b)=>Math.min(a,b),max=(a,b)=>Math.max(a,b),clamp=(n,a,b)=>max(a,min(b,n));
const money=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const rand=(a,b)=>a+Math.random()*(b-a);
const geom=()=>({cx:W*.5,rim:H*.685,rx:W*.34,ry:H*.105,floor:H*.672,r:W*.054});
function resize(){const oldW=W,oldH=H,r=canvas.getBoundingClientRect();W=max(1,r.width);H=max(1,r.height);dpr=min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
if(bodies.length&&oldW&&oldH){for(const p of bodies){p.x*=W/oldW;p.y*=H/oldH;p.r*=W/oldW;p.vx*=W/oldW;p.vy*=H/oldH;p.z*=H/oldH;if(p.settled)p.y=geom().rim+p.z;}}}
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);else window.addEventListener('resize',resize);resize();
// A horizontal, lightly overlapping arrangement on the soup surface.
// Each pork slice stays in the bowl's 2D surface plane; no vertical towers.
function initial(){const g=geom();
const positions=[[-.60,-.39],[-.20,-.50],[.21,-.48],[.60,-.34],[-.34,.36],[.34,.34]];
return positions.map(([x,z],i)=>newBody(g.cx+x*g.rx*.82,g.rim+z*g.ry*.76,{fixed:true,settled:true,z:z*g.ry*.76,seed:31+i*12}));}
function newBody(x,y,opt={}){return{x,y,vx:opt.vx||0,vy:opt.vy||0,vz:0,z:opt.z||0,r:geom().r,angle:rand(-.25,.25),omega:rand(-.35,.35),seed:opt.seed??rand(0,100),fixed:!!opt.fixed,settled:!!opt.settled,age:0,spilled:false};}
function inBowl(p,margin=1){const g=geom();const dx=(p.x-g.cx)/(g.rx*.83),dz=p.z/(g.ry*.72);return dx*dx+dz*dz<=margin*margin;}

function hud(){el.score.innerHTML=score+'<span class="unit">枚</span>';el.best.innerHTML=best+'<span class="unit">枚</span>';el.total.textContent=money(RAMEN+score*SLICE);}
function cleanHold(){holding=false;heldPointer=null;}
function start(){cleanHold();stage='play';ended=false;bodies=initial();score=BASE;aim=0;dir=1;shots=0;lastFire=-Infinity;el.overlay.classList.add('hidden');hud();}
function factor(n){return (Math.round(n/BASE*100)/100).toString();}
function payment(total){return Math.ceil(total/1000)*1000;}
function end(){if(ended||stage!=='play')return;ended=true;stage='over';cleanHold();const total=RAMEN+score*SLICE,pay=payment(total);
el.label.textContent='ゲームオーバー';el.title.classList.add('result-title');el.title.innerHTML=`チャーシューメン、<br>チャーシュー${factor(score)}倍`;
el.info.textContent=`${score}枚`;el.details.hidden=false;el.details.innerHTML=`<div><span>チャーシュー重量</span><b>${score*GRAMS}g</b></div><div><span>チャーシューの厚み</span><b>${score*MM}mm</b></div><div><span>お会計</span><b>${money(total)}</b></div><div><span>お預かり</span><b>${money(pay)}</b></div><div class="change"><span>お釣り</span><b>${money(pay-total)}</b></div>`;
el.start.textContent='もう一度';el.overlay.classList.remove('hidden');}
function fire(){if(stage!=='play'||now-lastFire<105)return;lastFire=now;const g=geom();
// Distribute shots between near and far sides of the ramen surface.
// This retains the original flat, shingled arrangement instead of a tower.
const lanes=[-.34,.35,-.03,-.48,.25,.06,.48,-.21];
const z=(lanes[shots%lanes.length]+rand(-.08,.08))*g.ry*.65;
const x=g.cx+aim*g.rx*.76;
shots++;
const p=newBody(x,H*.48,{vx:dir*rand(0,4),vy:0,z});
bodies.push(p);}

function ptrDown(e){if(stage!=='play')return;e.preventDefault();if(holding)return;holding=true;heldPointer=e.pointerId;holdStart=now;lastFire=-Infinity;fire();try{canvas.setPointerCapture(e.pointerId)}catch{}}
function ptrUp(e){if(heldPointer===null||e.pointerId===heldPointer)cleanHold();}
canvas.addEventListener('pointerdown',ptrDown);canvas.addEventListener('pointerup',ptrUp);canvas.addEventListener('pointercancel',ptrUp);canvas.addEventListener('lostpointercapture',ptrUp);window.addEventListener('pointerup',ptrUp);
window.addEventListener('blur',cleanHold);document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanHold()});
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();if(stage==='play'&&!e.repeat)fire();else if(stage!=='play')start();}});
el.start.addEventListener('click',start);el.restart.addEventListener('click',start);
function physics(dt){const g=geom(),step=dt/1000;
// Falling slices contact the bowl's flat soup plane, not previous slices' tops.
for(const p of bodies){if(p.fixed||p.spilled)continue;p.age+=dt;
if(!p.settled){p.vy=clamp(p.vy+1250*step,0,650);p.x+=p.vx*step;p.y+=p.vy*step;
p.angle+=p.omega*step*.18;
if(p.y>=g.rim+p.z){p.y=g.rim+p.z;p.vy=0;p.vx*=.13;p.omega=0;
if(!inBowl(p,1.08)){p.spilled=true;end();return;}markLanded(p);}}
else{p.x+=p.vx*step;p.z+=p.vz*step;p.y=g.rim+p.z;
// Very mild tabletop physics: gliding, friction, and gentle centering.
p.vx*=.90;p.vz*=.90;
p.vx+=(g.cx-p.x)*.08*step;p.vz+=(-p.z)*.04*step;
p.vx=clamp(p.vx,-48,48);p.vz=clamp(p.vz,-26,26);}
}
// Overlap is intentional, like overlapping chashu slices on noodles.
// Only a soft planar repulsion is applied; slices never prop each other up.
for(let k=0;k<2;k++){
for(let i=0;i<bodies.length;i++){const a=bodies[i];if(!a.settled||a.spilled)continue;
for(let j=i+1;j<bodies.length;j++){const b=bodies[j];if(!b.settled||b.spilled||a.fixed&&b.fixed)continue;
const dx=b.x-a.x,dz=b.z-a.z,dist=Math.hypot(dx,dz)||.00001;
const gap=(a.r+b.r)*.43;if(dist>=gap)continue;
const nx=dx/dist,nz=dz/dist,overlap=(gap-dist)*.10;
const ma=a.fixed||a.age>900?0:1,mb=b.fixed||b.age>900?0:1,sum=ma+mb;if(!sum)continue;
a.x-=nx*overlap*ma/sum;a.z-=nz*overlap*ma/sum;
b.x+=nx*overlap*mb/sum;b.z+=nz*overlap*mb/sum;
if(!a.fixed){a.vx-=nx*.14;a.vz-=nz*.10;a.y=g.rim+a.z;}
if(!b.fixed){b.vx+=nx*.14;b.vz+=nz*.10;b.y=g.rim+b.z;}
}}
}
for(const p of bodies){if(p.fixed||!p.settled||p.spilled)continue;
if(!inBowl(p,1.10)){p.spilled=true;end();return;}}
}

function markLanded(p){if(p.fixed||p.settled)return;p.settled=true;score++;if(score>best){best=score;try{localStorage.setItem('chashu-best-v3',String(best))}catch{}}hud();}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,max(.1,rx),max(.1,ry),0,0,Math.PI*2);if(color){ctx.fillStyle=color;ctx.fill()}}
function strokeEllipse(x,y,rx,ry,color,width){ellipse(x,y,rx,ry);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();}
function rr(x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function woodWall(){let grad=ctx.createLinearGradient(0,0,W,H*.62);grad.addColorStop(0,'#956c48');grad.addColorStop(.53,'#bb8860');grad.addColorStop(1,'#785138');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H*.635);
for(let i=0;i<11;i++){let y=H*.07+i*H*.057;ctx.lineWidth=i%3===0?3:1;ctx.strokeStyle=i%3===0?'#43271d32':'#57362525';ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.3,y+5,W*.66,y-7,W,y+2);ctx.stroke()}
ctx.fillStyle='#3a2116';ctx.fillRect(0,H*.614,W,12);ctx.fillStyle='#e2af78';ctx.fillRect(0,H*.628,W,5);
// Five individually hanging timber menu slats, all vertical.
const words=['餃子','ライス','野菜炒め','ラーメン','特製チャーシューメン'];
let boardH=H*.285,bw=min(47,W*.126),space=W*.017,total=words.length*bw+4*space,x=(W-total)/2;
for(let i=0;i<5;i++){ctx.save();const bx=x+i*(bw+space),by=H*.165+((i%2)*4);ctx.translate(bx+bw/2,by);ctx.rotate((i-2)*.012);
ctx.shadowColor='#3017107c';ctx.shadowBlur=8;ctx.shadowOffsetX=2;rr(-bw/2,0,bw,boardH,4,'#634025');ctx.shadowColor='transparent';let wg=ctx.createLinearGradient(-bw/2,0,bw/2,0);wg.addColorStop(0,'#a46b3c');wg.addColorStop(.25,'#dbab70');wg.addColorStop(.8,'#bd824e');wg.addColorStop(1,'#89522e');rr(-bw/2+2,2,bw-4,boardH-4,3,wg);
for(let k=0;k<3;k++){ctx.strokeStyle='#60341623';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-bw*.3+k*bw*.25,8);ctx.quadraticCurveTo(-bw*.20+k*bw*.22,boardH*.55,-bw*.3+k*bw*.25,boardH-7);ctx.stroke()}
ellipse(0,11,2.5,2.5,'#4e2b1a');ellipse(-.65,10.4,.7,.7,'#e7c196');
const n=words[i].length;const fs=min(bw*.45,boardH*.83/(n*.98));ctx.font=`900 ${fs}px "Yu Gothic",sans-serif`;ctx.fillStyle='#3a2118';ctx.textAlign='center';ctx.textBaseline='middle';
let hh=fs*.98,top=boardH*.54-n*hh*.5;for(let j=0;j<n;j++){
const ch=words[i][j];if(ch==='ー'){ctx.save();ctx.translate(0,top+j*hh);ctx.rotate(Math.PI/2);ctx.fillText(ch,0,0);ctx.restore();}
else ctx.fillText(ch,0,top+j*hh);}
ctx.restore();}
}
function counter(){const y=H*.635;let g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'#b37a47');g.addColorStop(.45,'#8b562f');g.addColorStop(1,'#52301d');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);
for(let k=0;k<11;k++){let yy=y+k*H*.037;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy+W*.035);ctx.lineWidth=1;ctx.strokeStyle=k%2?'#dfae7650':'#4b2d1952';ctx.stroke()}
ctx.fillStyle='#34201285';ctx.fillRect(0,H*.84,W,H*.016);
// Small lacquered chopstick rest at left.
ctx.save();ctx.translate(W*.075,H*.78);ctx.rotate(-.23);rr(0,0,W*.20,4,2,'#f3d299');rr(0,10,W*.20,4,2,'#d9a35b');ctx.restore();
}
function bowlDrawing(){const g=geom(),c=g.cx,y=g.rim,rx=g.rx,ry=g.ry;
ctx.save();ctx.shadowColor='#20100995';ctx.shadowBlur=24;ctx.shadowOffsetY=18;ellipse(c+6,H*.926,rx*.94,ry*.49,'#170c0a77');ctx.restore();
// Ceramic sides, with a visible elliptical mouth and deep curved front.
let body=ctx.createLinearGradient(0,y-ry,0,H*.955);body.addColorStop(0,'#fcf1da');body.addColorStop(.22,'#f6d7ae');body.addColorStop(.54,'#c94732');body.addColorStop(.82,'#8c2c29');body.addColorStop(1,'#44191e');
ctx.beginPath();ctx.moveTo(c-rx,y);ctx.bezierCurveTo(c-rx*.99,H*.84,c-rx*.69,H*.96,c,H*.958);ctx.bezierCurveTo(c+rx*.69,H*.96,c+rx*.99,H*.84,c+rx,y);ctx.closePath();ctx.fillStyle=body;ctx.fill();
ctx.strokeStyle='#fbdbab';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c-rx*.78,H*.839);ctx.quadraticCurveTo(c,H*.94,c+rx*.78,H*.839);ctx.stroke();
ctx.strokeStyle='#69211e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(c-rx*.77,H*.852);ctx.quadraticCurveTo(c,H*.957,c+rx*.77,H*.852);ctx.stroke();
// Ramen soup with ivory rim.
ellipse(c,y,rx,ry,'#fff3d7');ellipse(c,y,rx*.933,ry*.85,'#713b24');let broth=ctx.createRadialGradient(c-rx*.3,y-ry*.25,4,c,y,rx*.96);broth.addColorStop(0,'#ffd38a');broth.addColorStop(.64,'#e99b38');broth.addColorStop(1,'#a65a2a');
ellipse(c,y,rx*.875,ry*.78,broth);
ctx.save();ctx.beginPath();ctx.ellipse(c,y,rx*.85,ry*.74,0,0,7);ctx.clip();
for(let i=0;i<30;i++){const xx=c+Math.sin(i*2.26)*rx*.70,yy=y+Math.cos(i*1.49)*ry*.55;ctx.strokeStyle=i%3?'#ffe5a4b8':'#fff6cbd4';ctx.lineWidth=2.8;ctx.beginPath();ctx.moveTo(xx-18,yy);ctx.bezierCurveTo(xx,yy-9,xx+12,yy+10,xx+25,yy-3);ctx.stroke()}
for(let i=0;i<22;i++){const t=i*2.4,rad=Math.sqrt((i+.4)/22);ellipse(c+Math.cos(t)*rx*.67*rad,y+Math.sin(t)*ry*.55*rad,rand(2,4),rand(1.1,2.4),i%4===0?'#bddf7d':'#619a43')}
ctx.restore();
// Egg, soft yolk and nori add depth, but stay behind pork.
ctx.save();ctx.translate(c+rx*.55,y-ry*.31);ctx.rotate(-.34);ellipse(0,0,rx*.18,ry*.37,'#fff6e2');ellipse(0,0,rx*.12,ry*.24,'#f9ae34');ellipse(-rx*.02,-ry*.06,rx*.043,ry*.085,'#ffe69a');ctx.restore();
ctx.save();ctx.translate(c-rx*.66,y-ry*.47);ctx.rotate(-.19);rr(-rx*.16,-ry*.22,rx*.28,ry*.68,2,'#24312c');rr(-rx*.13,-ry*.20,rx*.20,ry*.58,1,'#304337');ctx.restore();
// Gold ornament on ceramic face.
ctx.strokeStyle='#f8c879';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c,H*.858,rx*.13,Math.PI*.15,Math.PI*1.85);ctx.stroke();ellipse(c,H*.858,rx*.027,rx*.027,'#f8c879');
}
function meat(p){const r=p.r;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
const shadow=ctx.createRadialGradient(2,r*.13,r*.1,0,0,r*1.1);shadow.addColorStop(0,'#41140a86');shadow.addColorStop(1,'#41140a00');ellipse(1,r*.17,r*1.18,r*.78,shadow);
// Charred, glazed outer edge.
let crust=ctx.createLinearGradient(0,-r*.79,0,r*.84);crust.addColorStop(0,'#97412c');crust.addColorStop(.55,'#a34930');crust.addColorStop(1,'#612c22');ellipse(0,0,r*1.10,r*.80,crust);
// Irregular-looking ring of creamy fat and tender pink pork.
ellipse(-r*.01,-r*.08,r*.99,r*.71,'#f3c49c');ellipse(r*.07,-r*.065,r*.85,r*.58,'#c77451');
ellipse(-r*.10,-r*.08,r*.61,r*.47,'#db9671');
ellipse(r*.10,-r*.04,r*.41,r*.34,'#bc6247');
ctx.lineWidth=max(1.7,r*.105);ctx.strokeStyle='#ffe0b9';ctx.beginPath();ctx.ellipse(-r*.01,-r*.09,r*.94,r*.67,-.04,.22,Math.PI*1.85);ctx.stroke();
ctx.lineWidth=max(.8,r*.035);ctx.strokeStyle='#a9503a85';ctx.beginPath();ctx.ellipse(-r*.08,-r*.08,r*.57,r*.42,.13,.2,5.7);ctx.stroke();
