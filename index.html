<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#160d0a">
  <meta name="description" content="チャーシューを狙って落とそう！何枚のせられる？無料ブラウザゲーム『チャーシューメン、チャーシュー12倍』">
  <title>チャーシューメン、チャーシュー12倍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="header">
      <div class="eyebrow">RAMEN STACKING CHALLENGE</div>
      <h1>チャーシューメン<span>チャーシュー<span class="accent">12倍</span></span></h1>
      <div class="rule"></div>
    </header>
    <section class="game-box" aria-label="ゲーム画面">
      <canvas id="game" aria-label="チャーシューをラーメンに落とすゲーム"></canvas>
      <div class="hud">
        <div class="hud-item"><span class="hud-label">のせた枚数</span><strong id="score">0<span class="unit"> 枚</span></strong></div>
        <div class="hud-item center-hud"><span class="hud-label">12倍まで</span><strong id="remaining">12<span class="unit"> 枚</span></strong></div>
        <div class="hud-item right-hud"><span class="hud-label">最高記録</span><strong id="best">0<span class="unit"> 枚</span></strong></div>
      </div>
      <div class="misses" id="misses" aria-label="残り失敗回数"><span>●</span><span>●</span><span>●</span></div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-panel">
          <span class="panel-eyebrow" id="panel-eyebrow">目指せ、伝説の12倍盛り</span>
          <h2 id="panel-title">チャーシューを<br>盛りまくれ！</h2>
          <p id="panel-text">左右に動くチャーシューを<br>タイミングよく落として重ねよう。<br>３回はみ出したら終了！</p>
          <button id="start-btn" class="primary-btn" type="button">ゲームスタート <span>▶</span></button>
          <p class="microcopy">タップ・クリック・スペースキーで落とす</p>
        </div>
      </div>
    </section>
    <section class="below">
      <div class="control-hint"><span class="finger">☝</span><span><strong>タイミングよくタップ！</strong><small>チャーシューが左右に動くよ</small></span></div>
      <button class="secondary-btn" id="restart" type="button">↻ はじめから</button>
    </section>
    <footer>ROO'S WORKSHOP <span>·</span> FREE BROWSER GAME</footer>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
