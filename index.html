<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#321b13"><title>チャーシューメン、チャーシュー12倍</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(#6d3b24,#21100e);color:#fff2d8;font-family:system-ui,"Yu Gothic",sans-serif;text-align:center}main{width:min(100%,560px);margin:auto;padding:12px}h1{font-size:clamp(23px,6vw,34px);line-height:1.3;margin:9px 0 15px;text-shadow:0 3px #542819}h1 span{display:block;color:#ffbe65}.scene{position:relative;aspect-ratio:3/4;max-height:76dvh;border:3px solid #b77541;border-radius:18px;overflow:hidden;background:#754528;touch-action:manipulation;box-shadow:0 12px 40px #0008}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none;gap:5px}.stat{background:#26100bdf;border:1px solid #b97f4e;border-radius:9px;padding:6px 8px;min-width:76px}.stat small{display:block;font-size:10px}.stat b{font-size:26px}.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#180c0bc9}.panel{border:2px solid #e4a55a;border-radius:18px;background:linear-gradient(#764027,#3d1c13);padding:24px 17px;width:min(100%,370px);box-shadow:0 12px 30px #0009}.panel h2{font-size:28px;margin:12px 0}.panel p{font-size:14px;line-height:1.9}button{font:900 17px system-ui;border:0;border-radius:28px;background:linear-gradient(#ffe4a1,#ffaf3d);color:#54220c;padding:14px 24px;cursor:pointer}#start{width:100%}.hide{display:none}.notice{position:absolute;top:28%;left:0;right:0;font-size:26px;font-weight:900;text-shadow:0 3px 5px #230d07;pointer-events:none;opacity:0;transition:opacity .2s}.notice.show{opacity:1}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px}.bottom button{font-size:12px;padding:10px 15px}footer{font-size:10px;color:#bd9471;margin-top:23px}
</style></head><body><main><h1>チャーシューメン<span>チャーシュー12倍</span></h1><div class="scene" id="scene"><canvas id="game"></canvas><div class="hud"><div class="stat"><small>のせた枚数</small><b id="score">0</b>枚</div><div class="stat"><small>12倍まで</small><b id="left">12</b>枚</div><div class="stat"><small>最高記録</small><b id="best">0</b>枚</div></div><div class="notice" id="notice"></div><div class="layer" id="layer"><div class="panel"><small id="caption">目指せ！伝説の12倍盛り</small><h2 id="heading">チャーシューを<br>盛りまくれ！</h2><p id="desc">左右に動くチャーシューをタップで落とそう。<br>3回はみ出すと終了！</p><button id="start">ゲームスタート ▶</button><p style="font-size:11px">タップ・クリック・スペースキーで落とす</p></div></div></div><div class="bottom"><span>タップでチャーシューを落とそう！</span><button id="restart">↻ はじめから</button></div><footer>ROO'S WORKSHOP · FREE BROWSER GAME</footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=390,H=520,dpr=1,mode='menu',score=0,miss=0,best=0,aim=-.75,dir=1,flight=null,stack=[],time=0,last=0,toastUntil=0;
try{best=Number(localStorage.getItem('chashu12x-best'))||0}catch{}$('best').textContent=best;
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
const cx=()=>W/2,cy=()=>H*.68,rx=()=>Math.min(W*.38,H*.285),ry=()=>rx()*.41;
function oval(x,y,a,b,color,stroke=null,lw=1){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,a),Math.max(.1,b),0,0,7);if(color){ctx.fillStyle=color;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function txt(s,x,y,size,color){ctx.fillStyle=color;ctx.font='bold '+size+'px sans-serif';ctx.textAlign='center';ctx.fillText(s,x,y)}
function board(){const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#52301f');bg.addColorStop(.6,'#a26438');bg.addColorStop(1,'#442015');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){ctx.strokeStyle='#3a180c44';ctx.lineWidth=2;ctx.beginPath();let y=H*(i+.5)/9;ctx.moveTo(0,y);ctx.lineTo(W,y+30);ctx.stroke()}ctx.save();ctx.translate(W*.13,H*.53);ctx.rotate(-.25);ctx.fillStyle='#f2c98a';ctx.fillRect(0,0,W*.35,5);ctx.fillStyle='#c9914b';ctx.fillRect(0,12,W*.35,5);ctx.restore()}
function bowl(){let x=cx(),y=cy(),a=rx(),b=ry();oval(x+7,y+b*.94,a*1.1,b*.74,'#210d0988');let g=ctx.createLinearGradient(0,y,0,y+b*1.6);g.addColorStop(0,'#f6ce9e');g.addColorStop(.5,'#be5c3e');g.addColorStop(1,'#61261e');oval(x,y+b*.5,a,b*1.15,g);oval(x,y,a,b,'#f8e6c7');oval(x,y,a*.91,b*.86,'#703523');oval(x,y,a*.84,b*.76,'#b96929');oval(x,y,a*.79,b*.68,'#e8a544');ctx.save();ctx.beginPath();ctx.ellipse(x,y,a*.77,b*.65,0,0,7);ctx.clip();for(let i=0;i<26;i++){let px=x+Math.sin(i*3.6)*a*.56,py=y+Math.cos(i*2.7)*b*.48;ctx.strokeStyle=i%2?'#ffe4a1':'#f4c56b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(px-13,py);ctx.bezierCurveTo(px+4,py-9,px+11,py+10,px+22,py-1);ctx.stroke()}for(let i=0;i<26;i++){let ang=i*2.399,r=Math.sqrt((i+.4)/26);oval(x+Math.cos(ang)*a*.65*r,y+Math.sin(ang)*b*.58*r,3,2,i%2?'#5c933b':'#a3c64d')}ctx.restore();oval(x,y,a,b,null,'#b65e41',3);oval(x,y,a*.95,b*.91,null,'#fff4d7',5)}
function pos(x,level=0){return {x:cx()+x*rx()*.79,y:cy()-level*4.1-ry()*.07}}
function meat(x,y,seed,scale=1){let a=rx()*.325*scale,b=ry()*.57*scale;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(seed*13)*.08);ctx.shadowColor='#210b0a9e';ctx.shadowBlur=9;ctx.shadowOffsetY=4;oval(0,0,a,b,'#6f2b20');ctx.shadowBlur=0;oval(0,-2,a*.94,b*.91,'#ae4a30');oval(0,-3,a*.82,b*.79,'#edb78a');oval(0,-3,a*.63,b*.64,'#b95136');oval(-a*.08,-b*.05,a*.48,b*.47,'#d7865e');oval(0,-3,a*.75,b*.73,null,'#ffe2b9',2.5);for(let i=0;i<7;i++){let ang=seed+i*2.4;oval(Math.cos(ang)*a*.42,Math.sin(ang)*b*.42,2.3,1.5,i%2?'#ffe1abbb':'#802a2177')}ctx.restore()}
function hud(){$('score').textContent=score;$('left').textContent=Math.max(0,12-score);$('best').textContent=best}
function toast(s){$('notice').textContent=s;$('notice').classList.add('show');toastUntil=time+1100}
function reset(){mode='play';score=0;miss=0;aim=-.75;dir=1;flight=null;stack=[];$('layer').classList.add('hide');$('notice').classList.remove('show');hud()}
function finish(){mode='over';$('caption').textContent=score>=12?'伝説のチャーシュー12倍！':'ラーメン完成！';$('heading').innerHTML=score+'枚のせた！';$('desc').innerHTML=(score>=12?'12倍盛り達成！<br>':'')+'3回はみ出しました。<br>もう一度挑戦しよう！';$('start').textContent='もう一度プレイ ▶';$('layer').classList.remove('hide')}
function drop(){if(mode!=='play'||flight)return;flight={x:aim,y:H*.23,v:0}}
function land(){const x=flight.x+(Math.random()-.5)*.045;flight=null;let prev=stack.at(-1);if(Math.abs(x)>1||prev&&Math.abs(x-prev.x)>.85+Math.min(score*.01,.18)){miss++;toast('はみ出した！ 残り'+(3-miss)+'回');if(miss>=3)finish();return}stack.push({x,seed:Math.random()*80,level:score*.36});score++;if(score>best){best=score;try{localStorage.setItem('chashu12x-best',best)}catch{}}hud();if(score===12)toast('祝！チャーシュー12倍達成！');else if(score%5===0)toast(score+'枚！まだまだ盛れる！')}
function frame(t){let dt=Math.min(45,t-last||16);last=t;time=t;if(mode==='play'){if(!flight){aim+=dir*(.94+score*.05)*dt/900;if(aim>.92){aim=.92;dir=-1}if(aim<-.92){aim=-.92;dir=1}}else{flight.v+=dt*.002;flight.y+=flight.v*dt;if(flight.y>=pos(flight.x,score*.36).y)land()}}
board();bowl();for(const p of stack){let q=pos(p.x,p.level);meat(q.x,q.y,p.seed)}if(mode==='play'){let p=pos(aim,score*.36);oval(p.x,p.y,rx()*.32,ry()*.55,'#fff0c527','#ffedb8b0',2);meat(pos(aim).x,flight?flight.y:H*.23+Math.sin(t*.004)*3,score+17,1.05)}if(time>toastUntil)$('notice').classList.remove('show');requestAnimationFrame(frame)}
$('start').addEventListener('click',reset);$('restart').addEventListener('click',reset);canvas.addEventListener('pointerdown',e=>{e.preventDefault();drop()});window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();mode==='play'?drop():reset()}});hud();requestAnimationFrame(frame);
})();
</script></body></html>
